[project]
name = "yana"
version = "0.1.0"
description = "Yet Another Notes App - CLI markdown notes with git sync and FZF"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Yehuda", email = "ploni@benploni.com"}
]

dependencies = [
    "iterfzf>=1.8.0",
    "typer>=0.20.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "watchdog>=6.0.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.1",
    "pytest-mock>=3.15.1",
    "pytest-cov>=7.0.0",
    "black>=25.11.0",
    "ruff>=0.14.4",
]

[project.scripts]
yana = "src.cli:app"

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
