[project]
name = "yana"
version = "0.1.0"
description = "Yet Another Notes App - CLI markdown notes with git sync and FZF"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Yehuda", email = "ploni@benploni.com"}
]

dependencies = [
    "iterfzf>=1.4.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
    "watchdog>=3.0.0",
    "python-frontmatter>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
]

[project.scripts]
yana = "src.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
